<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 582" role="img" aria-labelledby="title-880x582" aria-describedby="desc-880x582"><title id="title-880x582">Paper 2 — GLBA NPI per-category recall</title><desc id="desc-880x582">Horizontal bar chart of GLBA NPI per-category recall on the Paper 2 finance dataset (CFPB Consumer Complaint Database, 500-row tuned-sanitizer run). Each bar shows recall as a percentage with the ground-truth annotation count; bars are colored green at or above 90 percent recall and orange below 90 percent.</desc><style>.bg{fill:#ffffff}.axis{stroke:#57606a;fill:#57606a}.text{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.grid{stroke:#d0d7de}.groupBracket{stroke:#d0d7de;fill:none}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.axis{stroke:#9da7b1;fill:#9da7b1}.text{fill:#e6edf3}.grid{stroke:#30363d}.groupBracket{stroke:#30363d}}</style><rect class="bg" width="880" height="582"/><text class="text" x="20" y="30" font-size="18" font-weight="600">Paper 2 — GLBA NPI per-category recall</text><text class="text" x="20" y="52" font-size="12">CFPB Consumer Complaint Database (US public domain) + synthetic NPI injection, 500-row Measurement B subset, tuned sanitizer.</text><line class="grid" x1="200" y1="70" x2="200" y2="512" stroke-width="1"/><text class="text" x="200" y="530" font-size="11" text-anchor="middle">0%</text><line class="grid" x1="337.5" y1="70" x2="337.5" y2="512" stroke-width="1"/><text class="text" x="337.5" y="530" font-size="11" text-anchor="middle">25%</text><line class="grid" x1="475" y1="70" x2="475" y2="512" stroke-width="1"/><text class="text" x="475" y="530" font-size="11" text-anchor="middle">50%</text><line class="grid" x1="612.5" y1="70" x2="612.5" y2="512" stroke-width="1"/><text class="text" x="612.5" y="530" font-size="11" text-anchor="middle">75%</text><line class="grid" x1="750" y1="70" x2="750" y2="512" stroke-width="1"/><text class="text" x="750" y="530" fon