<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="title-880x500" aria-describedby="desc-880x500"><title id="title-880x500">Paper 1 vs Paper 2 — shared categories</title><desc id="desc-880x500">Grouped horizontal bar chart comparing Paper 1 (HIPAA Safe Harbor, MTSamples, blue) and Paper 2 (GLBA NPI, CFPB, purple) recall on the six PII categories that appear in both enumerations: NAME / FULL_NAME, EMAIL, PHONE, SSN, DATE / DOB, and ADDRESS.</desc><style>.bg{fill:#ffffff}.axis{stroke:#57606a;fill:#57606a}.text{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.grid{stroke:#d0d7de}.groupBracket{stroke:#d0d7de;fill:none}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.axis{stroke:#9da7b1;fill:#9da7b1}.text{fill:#e6edf3}.grid{stroke:#30363d}.groupBracket{stroke:#30363d}}</style><rect class="bg" width="880" height="500"/><text class="text" x="20" y="30" font-size="18" font-weight="600">Paper 1 vs Paper 2 — shared categories</text><text class="text" x="20" y="52" font-size="12">Recall on categories present in both HIPAA Safe Harbor and the GLBA NPI enumeration.</text><line class="grid" x1="160" y1="70" x2="160" y2="430" stroke-width="1"/><text class="text" x="160" y="448" font-size="11" text-anchor="middle">0%</text><line class="grid" x1="310" y1="70" x2="310" y2="430" stroke-width="1"/><text class="text" x="310" y="448" font-size="11" text-anchor="middle">25%</text><line class="grid" x1="460" y1="70" x2="460" y2="430" stroke-width="1"/><text class="text" x="460" y="448" font-size="11" text-anchor="middle">50%</text><line class="grid" x1="610" y1="70" x2="610" y2="430" stroke-width="1"/><text class="text" x="610" y="448" font-size="11" text-anchor="middle">75%</text><line class="grid" x1="760" y1="70" x2="760" y2="430" stroke-width="1"/><text class="text" x="760" y="448" font-size="11" text-anchor="middle">100%</text><text class="text" x="150" y="104" font-size="12" font-weight="600" text-anchor="end">NAME</text><rect x="160" y="78" width="555.42" height="18" fill="#0969da" rx="2"/><text class="text" x="721.42" y="91" font-size="11">Paper 1: 92.6%</text><rect x="160" y="100" width="546.96" height="18" fill="#8250df" rx="2"/><text class="text" x="712.96" y="113" font-size="11">Paper 2: 91.2%</text><text class="text" x="150" y="164" font-size="12" font-weight="600" text-anchor="end">EMAIL</text><rect x="160" y="138" width="590.34" height="18" fill="#0969da" rx="2"/><text class="text" x="756.34" y="151" font-size="11">Paper 1: 98.4%</text><rect x="160" y="160" width="586.26" height="18" fill="#8250df" rx="2"/><text class="text" x="752.26" y="173" font-size="11">Paper 2: 97.7%</text><text class="text" x="150" y="224" font-size="12" font-weight="600" text-anchor="end">PHONE</text><rect x="160" y="198" width="583.08" height="18" fill="#0969da" rx="2"/><text class="text" x="749.08" y="211" font-size="11">Paper 1: 97.2%</text><rect x="160" y="220" width="585.72" height="18" fill="#8250df" rx="2"/><text class="text" x="751.72" y="233" font-size="11">Paper 2: 97.6%</text><text class="text" x="150" y="284" font-size="12" font-weight="600" text-anchor="end">SSN</text><rect x="160" y="258" width="597.30" height="18" fill="#0969da" rx="2"/><text class="text" x="763.3" y="271" font-size="11">Paper 1: 99.5%</text><rect x="160" y="280" width="589.32" height="18" fill="#8250df" rx="2"/><text class="text" x="755.3199999999999" y="293" font-size="11">Paper 2: 98.2%</text><text class="text" x="150" y="344" font-size="12" font-weight="600" text-anchor="end">DATE / DOB</text><rect x="160" y="318" width="323.16" height="18" fill="#0969da" rx="2"/><text class="text" x="489.15999999999997" y="331" font-size="11">Paper 1: 53.9%</text><rect x="160" y="340" width="310.32" height="18" fill="#8250df" rx="2"/><text class="text" x="476.32" y="353" font-size="11">Paper 2: 51.7%</text><text class="text" x="150" y="404" font-size="12" font-weight="600" text-anchor="end">ADDRESS</text><rect x="160" y="378" width="501.00" height="18" fill="#0969da" rx="2"/><text class="text" x="667" y="391" font-size="11">Paper 1: 83.5%</text><rect x="160" y="400" width="550.26" height="18" fill="#8250df" rx="2"/><text class="text" x="716.26" y="413" font-size="11">Paper 2: 91.7%</text><text class="text" x="460" y="466" font-size="11" text-anchor="middle">Recall (true positives ÷ ground truth, %)</text><rect x="20" y="453" width="12" height="12" fill="#0969da" rx="2"/><text class="text" x="38" y="462" font-size="11">Paper 1 (HIPAA Safe Harbor, MTSamples)</text><rect x="320" y="453" width="12" height="12" fill="#8250df" rx="2"/><text class="text" x="338" y="462" font-size="11">Paper 2 (GLBA NPI, CFPB tuned run)</text><text class="text" x="20" y="482" font-size="10" opacity="0.75">Source: papers/paper-1-healthcare/SUMMARY-tuned.json (tuned run, 500 rows) + papers/paper-2-finance/SUMMARY-tuned.json (tuned run, 500 rows)</text><text class="text" x="20" y="494" font-size="10" opacity="0.75">"Date / DOB": HIPAA DATE includes any clinical date; GLBA DOB is date-of-birth only. ADDRESS: HIPAA GEO_SUBDIVISION vs GLBA RESIDENTIAL_ADDRESS.</text></svg>