<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 608" role="img" aria-labelledby="title-880x608" aria-describedby="desc-880x608"><title id="title-880x608">Paper 1 — HIPAA Safe Harbor per-category recall</title><desc id="desc-880x608">Horizontal bar chart of HIPAA Safe Harbor per-category recall on the Paper 1 healthcare dataset (MTSamples, 500-row tuned-sanitizer run). Each bar shows recall as a percentage with the ground-truth annotation count; bars are colored green at or above 90 percent recall and orange below 90 percent.</desc><style>.bg{fill:#ffffff}.axis{stroke:#57606a;fill:#57606a}.text{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.grid{stroke:#d0d7de}.groupBracket{stroke:#d0d7de;fill:none}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.axis{stroke:#9da7b1;fill:#9da7b1}.text{fill:#e6edf3}.grid{stroke:#30363d}.groupBracket{stroke:#30363d}}</style><rect class="bg" width="880" height="608"/><text class="text" x="20" y="30" font-size="18" font-weight="600">Paper 1 — HIPAA Safe Harbor per-category recall</text><text class="text" x="20" y="52" font-size="12">MTSamples (CC0) + synthetic PII injection at i2b2 density, 500-row Measurement B subset, tuned sanitizer.</text><line class="grid" x1="200" y1="70" x2="200" y2="538" stroke-width="1"/><text class="text" x="200" y="556" font-size="11" text-anchor="middle">0%</text><line class="grid" x1="337.5" y1="70" x2="337.5" y2="538" stroke-width="1"/><text class="text" x="337.5" y="556" font-size="11" text-anchor="middle">25%</text><line class="grid" x1="475" y1="70" x2="475" y2="538" stroke-width="1"/><text class="text" x="475" y="556" font-size="11" text-anchor="middle">50%</text><line class="grid" x1="612.5" y1="70" x2="612.5" y2="538" stroke-width="1"/><text class="text" x="612.5" y="556" font-size="11" text-anchor="middle">75%</text><line class="grid" x1="750" y1="70" x2="750" y2="538" stroke-width="1"/><text class="text" x="750" y="556" font-size="11" text-anchor="middle">100%</text><text class="text" x="190" y="87" font-size="11" text-anchor="end">NAME</text><rect x="200" y="76" width="509.13" height="16" fill="#2da44e" rx="2"/><text class="text" x="715.135" y="87" font-size="11">92.6% (n=2289)</text><text class="text" x="190" y="113" font-size="11" text-anchor="end">GEO_SUBDIVISION</text><rect x="200" y="102" width="459.25" height="16" fill="#bf8700" rx="2"/><text class="text" x="665.25" y="113" font-size="11">83.5% (n=1624)</text><text class="text" x="190" y="139" font-size="11" text-anchor="end">DATE</text><rect x="200" y="128" width="296.23" height="16" fill="#bf8700" rx="2"/><text class="text" x="502.22999999999996" y="139" font-size="11">53.9% (n=3936)</text><text class="text" x="190" y="165" font-size="11" text-anchor="end">PHONE</text><rect x="200" y="154" width="534.49" height="16" fill="#2da44e" rx="2"/><text class="text" x="740.49" y="165" font-size="11">97.2% (n=213)</text><text class="text" x="190" y="191" font-size="11" text-anchor="end">FAX</text><rect x="200" y="180" width="542.58" height="16" fill="#2da44e" rx="2"/><text class="text" x="748.575" y="191" font-size="11">98.7% (n=222)</text><text class="text" x="190" y="217" font-size="11" text-anchor="end">EMAIL</text><rect x="200" y="206" width="541.14" height="16" fill="#2da44e" rx="2"/><text class="text" x="747.145" y="217" font-size="11">98.4% (n=248)</text><text class="text" x="190" y="243" font-size="11" text-anchor="end">SSN</text><rect x="200" y="232" width="547.52" height="16" fill="#2da44e" rx="2"/><text class="text" x="753.525" y="243" font-size="11">99.5% (n=221)</text><text class="text" x="190" y="269" font-size="11" text-anchor="end">MRN</text><rect x="200" y="258" width="526.63" height="16" fill="#2da44e" rx="2"/><text class="text" x="732.625" y="269" font-size="11">95.8% (n=494)</text><text class="text" x="190" y="295" font-size="11" text-anchor="end">HEALTH_PLAN_ID</text><rect x="200" y="284" width="550.00" height="16" fill="#2da44e" rx="2"/><text class="text" x="756" y="295" font-size="11">100.0% (n=361)</text><text class="text" x="190" y="321" font-size="11" text-anchor="end">ACCOUNT_NUMBER</text><rect x="200" y="310" width="550.00" height="16" fill="#2da44e" rx="2"/><text class="text" x="756" y="321" font-size="11">100.0% (n=344)</text><text class="text" x="190" y="347" font-size="11" text-anchor="end">LICENSE_NUMBER</text><rect x="200" y="336" width="544.61" height="16" fill="#2da44e" rx="2"/><text class="text" x="750.61" y="347" font-size="11">99.0% (n=204)</text><text class="text" x="190" y="373" font-size="11" text-anchor="end">VEHICLE_ID</text><rect x="200" y="362" width="409.48" height="16" fill="#bf8700" rx="2"/><text class="text" x="615.475" y="373" font-size="11">74.5% (n=227)</text><text class="text" x="190" y="399" font-size="11" text-anchor="end">DEVICE_ID</text><rect x="200" y="388" width="547.75" height="16" fill="#2da44e" rx="2"/><text class="text" x="753.745" y="399" font-size="11">99.6% (n=241)</text><text class="text" x="190" y="425" font-size="11" text-anchor="end">URL</text><rect x="200" y="414" width="536.52" height="16" fill="#2da44e" rx="2"/><text class="text" x="742.525" y="425" font-size="11">97.5% (n=163)</text><text class="text" x="190" y="451" font-size="11" text-anchor="end">IP_ADDRESS</text><rect x="200" y="440" width="522.17" height="16" fill="#2da44e" rx="2"/><text class="text" x="728.17" y="451" font-size="11">94.9% (n=158)</text><text class="text" x="190" y="477" font-size="11" text-anchor="end">BIOMETRIC_ID</text><rect x="200" y="466" width="544.94" height="16" fill="#2da44e" rx="2"/><text class="text" x="750.94" y="477" font-size="11">99.1% (n=109)</text><text class="text" x="190" y="503" font-size="11" text-anchor="end">FACE_PHOTO_REF</text><rect x="200" y="492" width="530.20" height="16" fill="#2da44e" rx="2"/><text class="text" x="736.2" y="503" font-size="11">96.4% (n=111)</text><text class="text" x="190" y="529" font-size="11" text-anchor="end">OTHER_UNIQUE_ID</text><rect x="200" y="518" width="540.81" height="16" fill="#2da44e" rx="2"/><text class="text" x="746.8149999999999" y="529" font-size="11">98.3% (n=120)</text><text class="text" x="475" y="574" font-size="11" text-anchor="middle">Recall (true positives ÷ ground truth, %)</text><rect x="20" y="561" width="12" height="12" fill="#2da44e" rx="2"/><text class="text" x="38" y="570" font-size="11">≥ 90% recall</text><rect x="160" y="561" width="12" height="12" fill="#bf8700" rx="2"/><text class="text" x="178" y="570" font-size="11">&lt; 90% recall</text><text class="text" x="20" y="590" font-size="10" opacity="0.75">Source: papers/paper-1-healthcare/SUMMARY-tuned.json (tuned run, 500 rows)</text><text class="text" x="20" y="602" font-size="10" opacity="0.75">Green: recall ≥ 90%. Orange: recall &lt; 90%. n = ground-truth annotations in this category.</text></svg>