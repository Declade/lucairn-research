<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title"><title id="title">Lucairn sanitization + adversarial-test pipeline</title><style>.bg{fill:#ffffff}.axis{stroke:#57606a;fill:#57606a}.text{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.grid{stroke:#d0d7de}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.axis{stroke:#9da7b1;fill:#9da7b1}.text{fill:#e6edf3}.grid{stroke:#30363d}}</style><rect class="bg" width="760" height="320"/><text class="text" x="20" y="30" font-size="18" font-weight="600">Lucairn sanitization + adversarial-test pipeline</text><text class="text" x="20" y="52" font-size="12">Customer text flows L1 → L4. L1-L3 sanitize; L4 is an adversarial re-identification scorer.</text><rect x="14" y="84" width="452" height="106" fill="none" stroke="#d0d7de" stroke-dasharray="3,2" rx="6"/><text class="text" x="240" y="98" font-size="11" text-anchor="middle" opacity="0.7">sanitization layers</text><rect x="479" y="84" width="142" height="106" fill="none" stroke="#d0d7de" stroke-dasharray="3,2" rx="6"/><text class="text" x="550" y="98" font-size="11" text-anchor="middle" opacity="0.7">adversarial test</text><text class="text" x="14" y="216" font-size="10" opacity="0.7">in: customer doc</text><text class="text" x="770" y="216" font-size="10" text-anchor="end" opacity="0.7">out: signed claim → customer</text><rect x="20" y="110" width="130" height="70" fill="#0969da" rx="6"/><text x="85" y="138" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">L1</text><text x="85" y="160" font-size="11" fill="#ffffff" text-anchor="middle">Regex</text><rect x="175" y="110" width="130" height="70" fill="#0969da" rx="6"/><text x="240" y="138" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">L2</text><text x="240" y="160" font-size="11" fill="#ffffff" text-anchor="middle">Deny-list</text><rect x="330" y="110" width="130" height="70" fill="#0969da" rx="6"/><text x="395" y="138" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">L3</text><text x="395" y="160" font-size="11" fill="#ffffff" text-anchor="middle">PII Shield (Qwen)</text><rect x="485" y="110" width="130" height="70" fill="#8250df" rx="6"/><text x="550" y="138" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">L4</text><text x="550" y="160" font-size="11" fill="#ffffff" text-anchor="middle">reid-guard</text><rect x="640" y="110" width="130" height="70" fill="#2da44e" rx="6"/><text x="705" y="138" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Signed claim</text><text x="705" y="160" font-size="11" fill="#ffffff" text-anchor="middle">witness-emitted</text><line class="axis" x1="150" y1="145" x2="169" y2="145" stroke-width="2"/><polygon class="axis" points="169,141 175,145 169,149"/><line class="axis" x1="305" y1="145" x2="324" y2="145" stroke-width="2"/><polygon class="axis" points="324,141 330,145 324,149"/><line class="axis" x1="460" y1="145" x2="479" y2="145" stroke-width="2"/><polygon class="axis" points="479,141 485,145 479,149"/><line class="axis" x1="615" y1="145" x2="634" y2="145" stroke-width="2"/><polygon class="axis" points="634,141 640,145 634,149"/><text class="text" x="20" y="302" font-size="10" opacity="0.75">Architecture diagram — Lucairn dual-sandbox pipeline</text><text class="text" x="20" y="314" font-size="10" opacity="0.75">L1-L3 redact PII before any LLM call; L4 runs an attacker-LLM (Llama-3.1-8B) over the sanitized output + an aux corpus to score residual re-identification risk.</text></svg>